[profile.default]
src = "contracts"
test = "test"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/"
]

# Read-only access so SetJuiceRarity.s.sol can load the per-token rarity
# tiers computed from the collection's metadata.
fs_permissions = [
  { access = "read", path = "./script/data" }
]
